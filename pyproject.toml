[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-table-extractor"
version = "0.1.0"
description = "Tables from digital PDFs to clean Excel and CSV, with header detection, multi-page table stitching and a check on every table."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chase Builds" }]
dependencies = ["pdfplumber>=0.11", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "reportlab>=4"]

[project.scripts]
pdftables = "pdf_table_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["pdf_table_extractor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pdf_table_extractor", "benchmark"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "openpyxl.*", "reportlab.*"]
ignore_missing_imports = true
